name: KI Security and Test Suite

on:
  push:
    branches: [ki-foundation]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest
      - name: Run KI import and tenant-isolation tests
        run: python -m pytest app/test_ki_import.py app/test_tenancy.py app/test_audit.py -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ki
          POSTGRES_PASSWORD: ki_test_password
          POSTGRES_DB: ki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki -d ki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ki:ki_test_password@localhost:5432/ki_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest
      - name: Run PostgreSQL tenant integration test
        run: python -m pytest app/test_postgres_schema.py -q
